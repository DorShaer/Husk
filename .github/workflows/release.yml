name: Release

# Builds Husk binaries for Linux, macOS, and Windows when a v* tag is pushed,
# and uploads them to a GitHub Release. Manual workflow_dispatch is also
# allowed for dry-runs against main.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # id-token + attestations let actions/attest-build-provenance sign
  # the release artifacts with a GitHub-issued, Sigstore-backed claim.
  id-token: write
  attestations: write

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (current platform)
        env:
          # Skip macOS code-signing for now. Users will need to allow the
          # unsigned .app via Right-click > Open the first time. Once we have
          # an Apple Developer ID, set CSC_LINK and CSC_KEY_PASSWORD secrets
          # and remove this.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Disable Squirrel auto-update injection on Windows; we use NSIS.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Inventory dist/
        if: always()
        shell: bash
        run: |
          ls -la dist/ || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: husk-${{ matrix.os }}
          # Pick only the user-facing installers, not the unpacked tree.
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          retention-days: 30
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten into single dir
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp -v {} release/ \;
          # electron-builder's artifactName in package.json produces
          # space-free filenames (husk-vX-os-arch.ext) so no rename
          # pass is needed here.
          ls -la release

      - name: Generate SHA256SUMS for release artifacts
        run: |
          cd release
          # Hash every artifact and write a single SHA256SUMS file that
          # users can verify with `sha256sum -c SHA256SUMS`.
          rm -f SHA256SUMS
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> SHA256SUMS
          done
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Attest provenance for release artifacts
        # Signs every release artifact with a Sigstore-backed claim
        # tied to this workflow run. Users can verify with:
        #   gh attestation verify <file> --repo DorShaer/Husk
        # This also protects SHA256SUMS itself, so an attacker who
        # swaps a release asset cannot silently rewrite the sums file.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'release/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          # Use the annotated tag message as the release body (clean,
          # user-facing). Falls back to a simple installer notice if the
          # tag was lightweight. The previous setting (generate_release_notes:
          # true) auto-listed every PR + contributor including bots, which is
          # noisy for a public release page.
          body: |
            ## ${{ github.ref_name }}

            Pick the installer for your platform from the Assets below.

            See the README for documentation, and the project repository for the full changelog.
          generate_release_notes: false
          fail_on_unmatched_files: false
