name: Release

# Builds Husk binaries for Linux, macOS, and Windows when a v* tag is pushed,
# then uploads them to a GitHub Release.
#
# This workflow has two roles:
#   1. Build: compiles installers for every platform (always runs, tag or not).
#      Use manual workflow_dispatch on main to verify the build without publishing.
#   2. Release: publishes a GitHub Release (only runs when a v* tag triggered the workflow).
#
# Normal release flow:
#   - Run the "Cut Release Version" workflow (version.yml) to bump version and push the tag.
#   - This workflow fires automatically when that tag is pushed.
#   - Do NOT push v* tags manually unless you have also updated package.json and package-lock.json.
#
# The release job is intentionally guarded by 'startsWith(github.ref, "refs/tags/v")'.
# A manual workflow_dispatch run (e.g. to test the build) will run only the build job
# and skip the release job; this is expected and logged explicitly below.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Show trigger context
        shell: bash
        run: |
          echo "=== Release Workflow Context ==="
          echo "Actor : ${GITHUB_ACTOR}"
          echo "Event : ${GITHUB_EVENT_NAME}"
          echo "Ref   : ${GITHUB_REF}"
          echo "OS    : ${{ matrix.os }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Release job: WILL RUN after build succeeds (v* tag detected)"
          else
            echo "Release job: WILL BE SKIPPED (not a v* tag ref)"
            echo "  This is expected for manual workflow_dispatch runs."
            echo "  To publish a release, use the 'Cut Release Version' workflow."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (current platform)
        env:
          # Skip macOS code-signing for now. Users will need to allow the
          # unsigned .app via Right-click > Open the first time. Once we have
          # an Apple Developer ID, set CSC_LINK and CSC_KEY_PASSWORD secrets
          # and remove this.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Disable Squirrel auto-update injection on Windows; we use NSIS.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Inventory dist/
        if: always()
        shell: bash
        run: |
          ls -la dist/ || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: husk-${{ matrix.os }}
          # Pick only the user-facing installers, not the unpacked tree.
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          retention-days: 30
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Skipped on manual workflow_dispatch runs (where github.ref is a branch ref).
    # Only a v* tag push reaches this job. This is intentional and logged in the
    # "Show trigger context" step of the build job above.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: Show release context
        run: |
          echo "=== GitHub Release Job ==="
          echo "Tag : ${GITHUB_REF_NAME}"
          echo "Publishing release for ${GITHUB_REF_NAME}"

      - name: Guard against duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Checking whether release ${TAG} already exists..."
          if gh release view "${TAG}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "ERROR: Release ${TAG} already exists. Aborting to prevent duplicate."
            echo "  If you need to re-publish, delete the existing release on GitHub first."
            exit 1
          fi
          echo "No existing release found for ${TAG}. Proceeding."

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten into single dir
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
