name: tests

on:
  push:
    branches: [main, development, "dev/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  unit:
    name: unit (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e-smoke:
    name: e2e smoke (electron)
    runs-on: ubuntu-latest
    # The suite runs one worker and grew past ten minutes when the workflow
    # ecosystem and agent center landed. Thirty leaves room for a run that
    # fails slowly to still finish and report, without letting a hang run all
    # day: a job cancelled at the cap skips the steps that collect evidence.
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: install system deps for headless electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1 libxshmfence1
      - run: npm ci --no-audit --no-fund
      - name: smoke test under xvfb
        run: npm run test:e2e
      # What a failing run saw, so a red job is read rather than guessed at.
      - name: upload e2e failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-context
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    name: memory + stability profile (electron)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: install system deps for headless electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 libxss1 libxshmfence1
      - run: npm ci --no-audit --no-fund
      - name: memory and stability profile under xvfb
        run: npm run test:perf
      - name: upload perf report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-report
          path: test-results/perf-report.json
          if-no-files-found: ignore
