name: Security analysis

# Runs on every push to a long-lived branch, every pull request that targets
# one, weekly on Sunday 02:00 UTC for drift detection, and on demand.
on:
  push:
    branches: [main, development, "dev/**"]
    paths:
      - '**.js'
      - '**.html'
      - '**.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security.yml'
      - '.github/codeql/**'
      - '.gitleaks.toml'
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: '20'

jobs:
  secret-detection:
    name: Secret detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        # Pin the version. Resolving "latest" via the GitHub API hits rate
        # limits intermittently; keep same-major minor/patch bumps reviewed.
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's own
          # checksums file. Pinning a version authenticates nothing by itself:
          # a release asset can be replaced, and this binary runs with the
          # workflow's token over the full history. Bump both fields together.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xz -C /usr/local/bin -f "$tarball" gitleaks
          gitleaks version

      - name: Run Gitleaks
        id: gitleaks
        # Context values arrive as environment variables. An expression is
        # substituted into the script text before bash parses it, so the rule
        # is applied uniformly rather than argued per value.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Reports go to the runner temp directory, never to security-reports/,
          # because that directory is uploaded as an artifact and artifacts on a
          # public repository are downloadable by anyone for their whole
          # retention window. A scanner that finds a real secret and then
          # publishes it has done more damage than the commit it flagged.
          mkdir -p "$RUNNER_TEMP/gitleaks"
          # github.event.before is unreliable in two cases:
          #   - first push of a new branch: it is the all-zeros sha
          #   - force-push: it points to a now-orphaned sha that may
          #     not be reachable from the current HEAD
          # In either case the diff range is invalid and gitleaks
          # exits non-zero. Fall back to a full-repo scan, which is
          # the same path the pull_request event takes.
          BEFORE="$BEFORE_SHA"
          HEAD="$HEAD_SHA"
          ZERO_SHA='0000000000000000000000000000000000000000'
          USE_RANGE=0
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO_SHA" ]; then
            if git merge-base --is-ancestor "$BEFORE" "$HEAD" 2>/dev/null; then
              USE_RANGE=1
            fi
          fi
          # --redact masks the matched value in stdout and in the report.
          # Run logs on a public repository are readable without an account.
          sarif="$RUNNER_TEMP/gitleaks/gitleaks.sarif"
          set +e
          if [ "$USE_RANGE" = "1" ]; then
            gitleaks detect --config .gitleaks.toml --redact --log-opts="$BEFORE..$HEAD" \
              --report-format=sarif --report-path="$sarif"
          else
            gitleaks detect --config .gitleaks.toml --redact \
              --report-format=sarif --report-path="$sarif"
          fi
          status=$?
          set -e
          # The next step needs to know whether there is a file to upload, and it
          # cannot find out for itself: hashFiles only resolves paths under
          # GITHUB_WORKSPACE, so any test it runs against a runner-temp path is
          # false no matter what is on disk. A step output is read from the
          # runner, so it reports what is actually there.
          if [ -f "$sarif" ]; then echo "sarif=true" >> "$GITHUB_OUTPUT"; else echo "sarif=false" >> "$GITHUB_OUTPUT"; fi
          # A leak exits non-zero, and that is the gate. Report it after the
          # output is written so the findings still reach code scanning.
          exit $status

      # Code scanning is the private destination: alerts are visible to users
      # with security access to the repository, not to anonymous visitors, and
      # the values inside are already redacted above.
      # 8.30.1 writes the report on a clean run too, with zero results, and
      # uploading that is what closes an alert whose finding is now fixed. The
      # guard covers the other case, since whether a report is written at all is
      # a per-version detail and upload-sarif errors on a missing file.
      - name: Upload findings to code scanning
        if: always() && steps.gitleaks.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: ${{ runner.temp }}/gitleaks/gitleaks.sarif
          category: gitleaks

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install (no scripts)
        run: npm ci --ignore-scripts

      - name: npm audit (high + critical, all deps)
        # Run against the full dependency graph including devDependencies
        # since the build chain (electron-builder, electron itself) ships
        # binaries to end users. The gate fails on every high and critical
        # advisory except the ones recorded in scripts/audit-gate.js, each
        # with a reason and a review date.
        run: node scripts/audit-gate.js

      - name: npm audit JSON report (full, prod + dev)
        if: always()
        run: |
          mkdir -p security-reports
          npm audit --json > security-reports/npm-audit.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report
          path: security-reports/
          retention-days: 30

  javascript-security:
    name: JavaScript security (ESLint plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install (no scripts)
        run: npm ci --ignore-scripts

      - name: Install security linters
        run: |
          npm install --no-save \
            eslint@8 \
            eslint-plugin-security \
            eslint-plugin-no-unsanitized@4.0.2

      - name: Run ESLint security rules (strict scope)
        # Strict scope: src/preload.js, src/renderer/app.js, src/lib/.
        # New modules added here must lint clean at error. src/main.js
        # is the legacy monolith and is linted separately at warn while
        # it gets extracted into per-handler modules.
        run: |
          npx eslint \
            --no-eslintrc \
            --parser-options=ecmaVersion:2022,sourceType:script \
            --env es2022,browser,node \
            --plugin security \
            --plugin no-unsanitized \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-non-literal-fs-filename: error' \
            --rule 'security/detect-non-literal-require: error' \
            --rule 'security/detect-child-process: error' \
            --rule 'security/detect-unsafe-regex: error' \
            --rule 'security/detect-non-literal-regexp: error' \
            --rule 'security/detect-pseudoRandomBytes: error' \
            --rule 'security/detect-buffer-noassert: error' \
            --rule 'no-unsanitized/method: error' \
            --rule 'no-unsanitized/property: error' \
            --ignore-pattern 'libs/' \
            --ignore-pattern 'node_modules/' \
            --ignore-pattern 'src/renderer/vendor/' \
            src/preload.js src/renderer/app.js src/lib/

      - name: Run ESLint security rules (main.js, advisory)
        # main.js still has many legitimate dynamic fs operations; the
        # output is captured in security-reports for review but does
        # not gate the build. As IPC handlers are extracted into
        # src/lib or src/handlers they move to the strict scope above.
        continue-on-error: true
        run: |
          mkdir -p security-reports
          npx eslint \
            --no-eslintrc \
            --parser-options=ecmaVersion:2022,sourceType:script \
            --env es2022,browser,node \
            --plugin security \
            --plugin no-unsanitized \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-non-literal-fs-filename: warn' \
            --rule 'security/detect-non-literal-require: error' \
            --rule 'security/detect-child-process: warn' \
            --rule 'security/detect-unsafe-regex: error' \
            --rule 'security/detect-non-literal-regexp: warn' \
            --rule 'security/detect-pseudoRandomBytes: error' \
            --rule 'security/detect-buffer-noassert: error' \
            --rule 'no-unsanitized/method: warn' \
            --rule 'no-unsanitized/property: error' \
            src/main.js 2>&1 | tee security-reports/eslint-mainjs.txt

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep OWASP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pinned by digest. `:latest` means the scanner that gates this repo can
      # change between two runs of the same commit.
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        # The p/electron pack page exists on semgrep.dev but its config
        # endpoint at /c/p/electron returns 404, so the CLI cannot load it.
        # r/javascript.electron is the resolvable Electron-specific ruleset
        # and covers the same ground (nodeIntegration, contextIsolation,
        # webSecurity, missing CSP, etc.).
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/javascript
            p/nodejs
            p/xss
            p/command-injection
            r/javascript.electron
        run: semgrep scan --error --severity ERROR --exclude libs --exclude src/renderer/vendor --exclude node_modules .

      - name: Semgrep JSON (on failure)
        if: failure()
        run: |
          mkdir -p security-reports
          semgrep scan --config auto --exclude libs --exclude src/renderer/vendor --exclude node_modules --json > security-reports/semgrep.json || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: security-reports/
          retention-days: 30

  dependency-review:
    name: Dependency review (PR gate)
    # GitHub-native PR gate: blocks the PR if it introduces a dependency
    # with a known high/critical CVE or a non-allowed license. Runs only
    # on pull_request because the API is PR-scoped.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review new/changed dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  trivy:
    name: Filesystem CVEs (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reports dir
        run: mkdir -p security-reports

      - name: Trivy filesystem scan
        # Pinned by SHA (do not move to @master). Bumps go through dependabot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'security-reports/trivy-fs.txt'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          exit-code: '1'
          skip-dirs: 'libs/pai,src/renderer/vendor,node_modules,dist,test-results'

      - name: Trivy JSON (always)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'security-reports/trivy.json'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          skip-dirs: 'libs/pai,src/renderer/vendor,node_modules'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: security-reports/
          retention-days: 30

  summary:
    name: Security summary
    runs-on: ubuntu-latest
    needs:
      - secret-detection
      - npm-audit
      - javascript-security
      - codeql
      - semgrep
      - trivy
    if: always()
    steps:
      - name: Job summary
        env:
          R_SECRET: ${{ needs.secret-detection.result }}
          R_AUDIT: ${{ needs.npm-audit.result }}
          R_JS: ${{ needs.javascript-security.result }}
          R_CODEQL: ${{ needs.codeql.result }}
          R_SEMGREP: ${{ needs.semgrep.result }}
          R_TRIVY: ${{ needs.trivy.result }}
        run: |
          # A job result is one of success/failure/cancelled/skipped, so this
          # maps it to a word rather than interpolating an expression into the
          # script text.
          verdict() { [ "$1" = "success" ] && printf '%s' "$2" || printf 'FAILED'; }
          {
            echo "# Security scan summary"
            echo
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Secret detection | $(verdict "$R_SECRET" CLEAN) |"
            echo "| npm audit | $(verdict "$R_AUDIT" PASSED) |"
            echo "| JavaScript security | $(verdict "$R_JS" PASSED) |"
            echo "| CodeQL | $(verdict "$R_CODEQL" PASSED) |"
            echo "| Semgrep OWASP | $(verdict "$R_SEMGREP" PASSED) |"
            echo "| Trivy CVEs | $(verdict "$R_TRIVY" PASSED) |"
            echo
            echo "Reports are in the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = `## Security scan summary

            | Check | Status |
            |-------|--------|
            | Secret detection | ${{ needs.secret-detection.result == 'success' && 'CLEAN' || 'FAILED' }} |
            | npm audit | ${{ needs.npm-audit.result == 'success' && 'PASSED' || 'FAILED' }} |
            | JavaScript security | ${{ needs.javascript-security.result == 'success' && 'PASSED' || 'FAILED' }} |
            | CodeQL | ${{ needs.codeql.result == 'success' && 'PASSED' || 'FAILED' }} |
            | Semgrep OWASP | ${{ needs.semgrep.result == 'success' && 'PASSED' || 'FAILED' }} |
            | Trivy CVEs | ${{ needs.trivy.result == 'success' && 'PASSED' || 'FAILED' }} |

            Detailed reports are in **Actions > this run > Artifacts**.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
