name: Security analysis

# Runs on every push to a long-lived branch, every pull request that targets
# one, weekly on Sunday 02:00 UTC for drift detection, and on demand.
on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.js'
      - '**.html'
      - '**.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security.yml'
      - '.github/codeql/**'
      - '.gitleaks.toml'
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: '20'

jobs:
  secret-detection:
    name: Secret detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        # Pin the version. Resolving "latest" via the GitHub API hits rate
        # limits intermittently; bumps go through dependabot (github-actions
        # ecosystem).
        env:
          GITLEAKS_VERSION: "8.22.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          mkdir -p security-reports
          if [ "${{ github.event_name }}" = "push" ]; then
            gitleaks detect --config .gitleaks.toml --log-opts="${{ github.event.before }}..${{ github.sha }}" --report-format=json --report-path=security-reports/gitleaks-report.json
          else
            gitleaks detect --config .gitleaks.toml --report-format=json --report-path=security-reports/gitleaks-report.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-detection-report
          path: security-reports/
          retention-days: 30

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install (no scripts)
        run: npm ci --ignore-scripts

      - name: npm audit (high + critical, all deps)
        # Run against the full dependency graph including devDependencies
        # since the build chain (electron-builder, electron itself) ships
        # binaries to end users. Local-only dev tools that do not touch
        # the build can be excluded via per-advisory ignores when needed.
        run: npm audit --audit-level=high

      - name: npm audit JSON report (full, prod + dev)
        if: always()
        run: |
          mkdir -p security-reports
          npm audit --json > security-reports/npm-audit.json || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report
          path: security-reports/
          retention-days: 30

  javascript-security:
    name: JavaScript security (ESLint plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install (no scripts)
        run: npm ci --ignore-scripts

      - name: Install security linters
        run: |
          npm install --no-save \
            eslint@8 \
            eslint-plugin-security \
            eslint-plugin-no-unsanitized@4.0.2

      - name: Run ESLint security rules
        # Scope to our own JS only. libs/pai is bundled third-party; the
        # vendored xterm.js inside src/renderer/vendor/ is minified.
        run: |
          npx eslint \
            --no-eslintrc \
            --parser-options=ecmaVersion:2022,sourceType:script \
            --env es2022,browser,node \
            --plugin security \
            --plugin no-unsanitized \
            --rule 'security/detect-eval-with-expression: error' \
            --rule 'security/detect-non-literal-fs-filename: warn' \
            --rule 'security/detect-non-literal-require: error' \
            --rule 'security/detect-child-process: warn' \
            --rule 'security/detect-unsafe-regex: error' \
            --rule 'security/detect-non-literal-regexp: warn' \
            --rule 'security/detect-pseudoRandomBytes: error' \
            --rule 'security/detect-buffer-noassert: error' \
            --rule 'no-unsanitized/method: warn' \
            --rule 'no-unsanitized/property: error' \
            --ignore-pattern 'libs/' \
            --ignore-pattern 'node_modules/' \
            --ignore-pattern 'src/renderer/vendor/' \
            src/main.js src/preload.js src/renderer/app.js

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep OWASP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep
        # The p/electron pack page exists on semgrep.dev but its config
        # endpoint at /c/p/electron returns 404, so the CLI cannot load it.
        # r/javascript.electron is the resolvable Electron-specific ruleset
        # and covers the same ground (nodeIntegration, contextIsolation,
        # webSecurity, missing CSP, etc.).
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/javascript
            p/nodejs
            p/xss
            p/command-injection
            r/javascript.electron
        run: semgrep scan --error --severity ERROR --exclude libs --exclude src/renderer/vendor --exclude node_modules .

      - name: Semgrep JSON (on failure)
        if: failure()
        run: |
          mkdir -p security-reports
          semgrep scan --config auto --exclude libs --exclude src/renderer/vendor --exclude node_modules --json > security-reports/semgrep.json || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: security-reports/
          retention-days: 30

  dependency-review:
    name: Dependency review (PR gate)
    # GitHub-native PR gate: blocks the PR if it introduces a dependency
    # with a known high/critical CVE or a non-allowed license. Runs only
    # on pull_request because the API is PR-scoped.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Review new/changed dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  trivy:
    name: Filesystem CVEs (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Reports dir
        run: mkdir -p security-reports

      - name: Trivy filesystem scan
        # Pinned by SHA (do not move to @master). Bumps go through dependabot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'security-reports/trivy-fs.txt'
          severity: 'CRITICAL'
          vuln-type: 'library'
          exit-code: '1'
          skip-dirs: 'libs/pai,src/renderer/vendor,node_modules'

      - name: Trivy JSON (always)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'security-reports/trivy.json'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'
          skip-dirs: 'libs/pai,src/renderer/vendor,node_modules'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: security-reports/
          retention-days: 30

  summary:
    name: Security summary
    runs-on: ubuntu-latest
    needs:
      - secret-detection
      - npm-audit
      - javascript-security
      - codeql
      - semgrep
      - trivy
    if: always()
    steps:
      - name: Job summary
        run: |
          {
            echo "# Security scan summary"
            echo
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Secret detection | ${{ needs.secret-detection.result == 'success' && 'CLEAN' || 'FAILED' }} |"
            echo "| npm audit | ${{ needs.npm-audit.result == 'success' && 'PASSED' || 'FAILED' }} |"
            echo "| JavaScript security | ${{ needs.javascript-security.result == 'success' && 'PASSED' || 'FAILED' }} |"
            echo "| CodeQL | ${{ needs.codeql.result == 'success' && 'PASSED' || 'FAILED' }} |"
            echo "| Semgrep OWASP | ${{ needs.semgrep.result == 'success' && 'PASSED' || 'FAILED' }} |"
            echo "| Trivy CVEs | ${{ needs.trivy.result == 'success' && 'PASSED' || 'FAILED' }} |"
            echo
            echo "Reports are in the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = `## Security scan summary

            | Check | Status |
            |-------|--------|
            | Secret detection | ${{ needs.secret-detection.result == 'success' && 'CLEAN' || 'FAILED' }} |
            | npm audit | ${{ needs.npm-audit.result == 'success' && 'PASSED' || 'FAILED' }} |
            | JavaScript security | ${{ needs.javascript-security.result == 'success' && 'PASSED' || 'FAILED' }} |
            | CodeQL | ${{ needs.codeql.result == 'success' && 'PASSED' || 'FAILED' }} |
            | Semgrep OWASP | ${{ needs.semgrep.result == 'success' && 'PASSED' || 'FAILED' }} |
            | Trivy CVEs | ${{ needs.trivy.result == 'success' && 'PASSED' || 'FAILED' }} |

            Detailed reports are in **Actions > this run > Artifacts**.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
