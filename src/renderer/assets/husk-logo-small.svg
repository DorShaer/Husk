<!-- Small-size variant of the Husk mark, for 16 to 32px icons. Same character,
     but the hands, sheen, cheeks and fine shading are dropped and the face is
     framed tighter: at those sizes the detail in the full mark collapses into
     a brown smudge. Rendered by scripts/render-logo.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 214" width="200" height="214" role="img" aria-label="Husk">
  <defs>
    <linearGradient id="s-rind-l" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#cd6c33"/><stop offset="1" stop-color="#96410f"/>
    </linearGradient>
    <linearGradient id="s-rind-r" x1="1" y1="0" x2="0" y2="0.7">
      <stop offset="0" stop-color="#e8862f"/><stop offset="1" stop-color="#a44814"/>
    </linearGradient>
    <linearGradient id="s-face-l" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a949"/><stop offset="1" stop-color="#d1701f"/>
    </linearGradient>
    <linearGradient id="s-face-r" x1="0.8" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb857"/><stop offset="1" stop-color="#dd7a26"/>
    </linearGradient>
    <linearGradient id="s-pit" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#632f14"/><stop offset="1" stop-color="#341607"/>
    </linearGradient>
    <radialGradient id="s-body" gradientUnits="userSpaceOnUse" cx="88" cy="58" r="108">
      <stop offset="0" stop-color="#fff3d8"/>
      <stop offset="0.5" stop-color="#fdd191"/>
      <stop offset="1" stop-color="#e79447"/>
    </radialGradient>
    <linearGradient id="s-sprout" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#3d7c47"/><stop offset="1" stop-color="#8ed07f"/>
    </linearGradient>
  </defs>

  <path d="M46 52 C 58 96, 78 150, 100 202 C 122 150, 142 96, 154 52 C 132 84, 68 84, 46 52 Z" fill="url(#s-pit)"/>
  <g transform="rotate(-20 100 200)">
    <path d="M100 12 C 140 46, 170 76, 170 108 C 170 142, 140 178, 100 202 Z" fill="url(#s-pit)"/>
  </g>
  <g transform="rotate(20 100 200)">
    <path d="M100 12 C 60 46, 30 76, 30 108 C 30 142, 60 178, 100 202 Z" fill="url(#s-pit)"/>
  </g>

  <g transform="rotate(-3 100 150)">
    <path d="M99 34 C 96 16, 86 5, 70 0 C 83 -7, 100 2, 105 17 C 111 2, 124 -5, 138 0 C 131 19, 116 32, 102 35 Z" fill="url(#s-sprout)"/>
    <path d="M100 32 C 131 32, 143 56, 142 83 C 141 114, 123 142, 100 150 C 77 142, 59 114, 58 83 C 57 56, 69 32, 100 32 Z" fill="url(#s-body)"/>
    <path d="M100 150 C 77 142, 59 114, 58 87 C 66 116, 80 134, 100 142 C 120 134, 134 116, 142 87 C 141 114, 123 142, 100 150 Z" fill="#c9762f" opacity="0.22"/>

    <!-- eyes carry the whole read at this size, so they are bigger and darker -->
    <ellipse cx="78" cy="84" rx="15" ry="17.5" fill="#261206"/>
    <ellipse cx="122" cy="84" rx="15" ry="17.5" fill="#261206"/>
    <circle cx="72.5" cy="76" r="5.4" fill="#fff"/>
    <circle cx="116.5" cy="76" r="5.4" fill="#fff"/>
    <path d="M92 116 C 96 121, 104 121, 108 116" stroke="#8f4816" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <g transform="rotate(-20 100 200)">
    <path d="M100 12 C 60 46, 30 76, 30 108 C 30 142, 60 178, 100 202 Z" fill="url(#s-rind-l)"/>
    <path d="M100 12 C 90 52, 79 92, 81 130 C 83 166, 92 186, 100 202 Z" fill="url(#s-face-l)"/>
  </g>
  <g transform="rotate(20 100 200)">
    <path d="M100 12 C 140 46, 170 76, 170 108 C 170 142, 140 178, 100 202 Z" fill="url(#s-rind-r)"/>
    <path d="M100 12 C 110 52, 121 92, 119 130 C 117 166, 108 186, 100 202 Z" fill="url(#s-face-r)"/>
  </g>
</svg>
