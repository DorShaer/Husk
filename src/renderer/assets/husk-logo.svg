<!-- The Husk mark: the pod, shut. This is the logo. The character that hatches out
     of it lives in the welcome tour, not here.
     Source of truth for the app icon, the site and the README. The PNGs beside
     this file are rendered from it by scripts/render-logo.sh, so edit here and
     re-render rather than touching them directly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 214" width="200" height="214" role="img" aria-label="Husk">
  <defs>
    <linearGradient id="rind-l" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#c96a33"/><stop offset="0.55" stop-color="#b0521c"/>
      <stop offset="1" stop-color="#8e3d12"/>
    </linearGradient>
    <linearGradient id="rind-r" x1="1" y1="0" x2="0" y2="0.7">
      <stop offset="0" stop-color="#e2822f"/><stop offset="0.55" stop-color="#c25f1f"/>
      <stop offset="1" stop-color="#9c4514"/>
    </linearGradient>
    <linearGradient id="face-l" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5a349"/><stop offset="1" stop-color="#d1701f"/>
    </linearGradient>
    <linearGradient id="face-r" x1="0.8" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdb257"/><stop offset="1" stop-color="#dd7a26"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- left half, then right, each with the pale inner face along the seam -->
  <path d="M100 12 C 60 46, 30 76, 30 108 C 30 142, 60 178, 100 202 Z" fill="url(#rind-l)"/>
  <path d="M100 12 C 90 52, 79 92, 81 130 C 83 166, 92 186, 100 202 Z" fill="url(#face-l)"/>
  <path d="M96 24 C 66 54, 44 82, 44 110 C 50 84, 72 54, 96 30 Z" fill="url(#sheen)"/>

  <path d="M100 12 C 140 46, 170 76, 170 108 C 170 142, 140 178, 100 202 Z" fill="url(#rind-r)"/>
  <path d="M100 12 C 110 52, 121 92, 119 130 C 117 166, 108 186, 100 202 Z" fill="url(#face-r)"/>
  <path d="M104 24 C 134 54, 156 82, 156 110 C 150 84, 128 54, 104 30 Z" fill="url(#sheen)"/>
</svg>
